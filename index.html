<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Encryption (Multi-File Support)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .container { border: 1px solid #ccc; padding: 2rem; border-radius: 8px; }
        input, button { margin-top: 10px; width: 100%; padding: 10px; box-sizing: border-box; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; word-break: break-all; }
        .note { font-size: 0.9em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>File Encryption & Zipping</h2>
    <p>Select one or multiple files. Multiple files will be automatically zipped before encryption.</p>
    
    <label>1. Select File(s):</label>
    <input type="file" id="fileInput" multiple>
    
    <label>2. Enter Password:</label>
    <input type="password" id="passwordInput" placeholder="Enter a strong password">
    
    <button onclick="processFile(true)">Encrypt & Download</button>
    <button onclick="processFile(false)" style="background-color: #28a745;">Decrypt & Download</button>

    <div id="status"></div>
</div>

<script>
    const saltLength = 16; // Bytes for PBKDF2 salt
    const ivLength = 12;   // Bytes for AES-GCM IV

    async function processFile(isEncrypt) {
        const fileInput = document.getElementById('fileInput');
        const password = document.getElementById('passwordInput').value;
        const statusDiv = document.getElementById('status');

        if (!fileInput.files.length || !password) {
            alert("Please select file(s) and enter a password.");
            return;
        }

        statusDiv.textContent = isEncrypt ? "Processing..." : "Decrypting...";

        try {
            let dataBuffer;
            let outputFilename;

            // --- 1. PREPARE DATA (Zip if multiple, or Read if single) ---
            if (isEncrypt) {
                if (fileInput.files.length > 1) {
                    // MULTIPLE FILES: ZIP THEM
                    statusDiv.textContent = "Zipping files...";
                    const zip = new JSZip();
                    // Add all selected files to the zip object
                    for (const file of fileInput.files) {
                        zip.file(file.name, file);
                    }
                    // Generate the zip file as a buffer
                    dataBuffer = await zip.generateAsync({type: "arraybuffer"});
                    outputFilename = "archive.zip.enc"; // Generic name for package
                } else {
                    // SINGLE FILE: READ DIRECTLY
                    const file = fileInput.files[0];
                    dataBuffer = await file.arrayBuffer();
                    outputFilename = file.name + ".enc";
                }
            } else {
                // DECRYPTION: Read the single encrypted file
                const file = fileInput.files[0];
                dataBuffer = await file.arrayBuffer();
                // Determine output name (remove .enc)
                outputFilename = file.name.replace(/\.enc$/, '');
            }

            // --- 2. CRYPTOGRAPHIC OPERATIONS ---
            let resultBuffer;
            
            if (isEncrypt) {
                statusDiv.textContent = "Encrypting...";
                const salt = window.crypto.getRandomValues(new Uint8Array(saltLength));
                const iv = window.crypto.getRandomValues(new Uint8Array(ivLength));
                const key = await deriveKey(password, salt);

                const encryptedContent = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    dataBuffer
                );

                // Pack Salt + IV + Encrypted Data
                resultBuffer = new Uint8Array(salt.length + iv.length + encryptedContent.byteLength);
                resultBuffer.set(salt, 0);
                resultBuffer.set(iv, saltLength);
                resultBuffer.set(new Uint8Array(encryptedContent), saltLength + ivLength);
            } else {
                // DECRYPTION FLOW
                const data = new Uint8Array(dataBuffer);
                
                const salt = data.slice(0, saltLength);
                const iv = data.slice(saltLength, saltLength + ivLength);
                const encryptedContent = data.slice(saltLength + ivLength);

                const key = await deriveKey(password, salt);

                const decryptedContent = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    encryptedContent
                );

                resultBuffer = new Uint8Array(decryptedContent);
            }

            // --- 3. DOWNLOAD RESULT ---
            downloadFile(resultBuffer, outputFilename);
            statusDiv.textContent = "Done! Download started.";

        } catch (e) {
            console.error(e);
            statusDiv.textContent = "Error: Incorrect password, corrupted file, or browser memory limit reached.";
        }
    }

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", 
            enc.encode(password), 
            { name: "PBKDF2" }, 
            false, 
            ["deriveKey"]
        );

        return window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
        );
    }

    function downloadFile(data, filename) {
        const blob = new Blob([data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
