<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local File Encryption</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .container { border: 1px solid #ccc; padding: 2rem; border-radius: 8px; }
        input, button { margin-top: 10px; width: 100%; padding: 10px; box-sizing: border-box; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>Standalone File Encryption</h2>
    <p>Select a file and enter a password. The file is processed entirely in your browser.</p>
    
    <label>1. Select File:</label>
    <input type="file" id="fileInput">
    
    <label>2. Enter Password:</label>
    <input type="password" id="passwordInput" placeholder="Enter a strong password">
    
    <button onclick="processFile(true)">Encrypt & Download</button>
    <button onclick="processFile(false)" style="background-color: #28a745;">Decrypt & Download</button>

    <div id="status"></div>
</div>

<script>
    const saltLength = 16; // Bytes for PBKDF2 salt
    const ivLength = 12;   // Bytes for AES-GCM IV

    async function processFile(isEncrypt) {
        const fileInput = document.getElementById('fileInput');
        const password = document.getElementById('passwordInput').value;
        const statusDiv = document.getElementById('status');

        if (!fileInput.files.length || !password) {
            alert("Please select a file and enter a password.");
            return;
        }

        const file = fileInput.files[0];
        const fileBuffer = await file.arrayBuffer();
        statusDiv.textContent = isEncrypt ? "Encrypting..." : "Decrypting...";

        try {
            let resultBuffer;
            
            if (isEncrypt) {
                // ENCRYPTION FLOW
                const salt = window.crypto.getRandomValues(new Uint8Array(saltLength));
                const iv = window.crypto.getRandomValues(new Uint8Array(ivLength));
                const key = await deriveKey(password, salt);

                const encryptedContent = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    fileBuffer
                );

                // Pack Salt + IV + Encrypted Data together
                resultBuffer = new Uint8Array(salt.length + iv.length + encryptedContent.byteLength);
                resultBuffer.set(salt, 0);
                resultBuffer.set(iv, saltLength);
                resultBuffer.set(new Uint8Array(encryptedContent), saltLength + ivLength);

                downloadFile(resultBuffer, file.name + ".enc");
            } else {
                // DECRYPTION FLOW
                const data = new Uint8Array(fileBuffer);
                
                // Extract Salt and IV from the beginning of the file
                const salt = data.slice(0, saltLength);
                const iv = data.slice(saltLength, saltLength + ivLength);
                const encryptedContent = data.slice(saltLength + ivLength);

                const key = await deriveKey(password, salt);

                const decryptedContent = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    encryptedContent
                );

                resultBuffer = new Uint8Array(decryptedContent);
                // Remove ".enc" from filename if present
                const originalName = file.name.replace(/\.enc$/, '');
                downloadFile(resultBuffer, originalName);
            }
            statusDiv.textContent = "Done!";
        } catch (e) {
            console.error(e);
            statusDiv.textContent = "Error: Incorrect password or corrupted file.";
        }
    }

    // Generate a cryptographic key from the password
    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", 
            enc.encode(password), 
            { name: "PBKDF2" }, 
            false, 
            ["deriveKey"]
        );

        return window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
        );
    }

    // Helper to trigger download
    function downloadFile(data, filename) {
        const blob = new Blob([data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
